name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract project and fix Gradle
        run: |
          mkdir project
          unzip -o B_Social_AI_Academy_v1.zip -d project
          cd project
          
          # Inda muke neman gradle wrapper da kanta
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
